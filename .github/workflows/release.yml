name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Update this commit deliberately when the rules repository's atomic suite changes.
  RUSTINEL_RULES_REF: c1d78b4dec00eef42b5ccb741da6f7e7521dd854

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Gates
    uses: ./.github/workflows/ci.yml
    with:
      skip_atomics: true
    permissions:
      contents: read

  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Download eBPF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-ebpf-object
          path: ebpf/

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustinel-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/rustinel
          retention-days: 1

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Download eBPF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-ebpf-object
          path: ebpf/

      - name: Install cross
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cross

      - name: Build
        run: cross build --locked --release --target aarch64-unknown-linux-musl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustinel-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rustinel
          retention-days: 1

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    needs: ci
    # Lifted to the job so the signing steps can ask whether credentials exist.
    # A secret is not readable through `env.` in a step condition unless it is
    # mapped here first, and without that every `if` below is silently false and
    # the release ships unsigned.
    env:
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true
      - run: cargo build --locked --release

      - name: Verify binary
        run: |
          if (!(Test-Path target/release/rustinel.exe)) {
            Write-Error "Binary not found"
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item target/release/rustinel.exe).Length / 1MB, 2)
          Write-Output "Binary: target/release/rustinel.exe ($sizeMB MB)"
          $bytes = [IO.File]::ReadAllBytes("target/release/rustinel.exe")
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            Write-Error "Binary is not a valid DOS executable"
            exit 1
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 24 + 80 -gt $bytes.Length) {
            Write-Error "Binary has an invalid PE header offset or truncated optional header"
            exit 1
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            Write-Error "Binary is not a valid PE executable"
            exit 1
          }
          $optionalHeaderOffset = $peOffset + 24
          if ([BitConverter]::ToUInt16($bytes, $optionalHeaderOffset) -ne 0x20b) {
            Write-Error "Binary is not a 64-bit PE executable"
            exit 1
          }
          # PE32+ stores SizeOfStackReserve 72 bytes into the optional header.
          $stackReserve = [BitConverter]::ToUInt64($bytes, $optionalHeaderOffset + 72)
          $expectedStackReserve = [uint64]0x1000000
          Write-Output ("SizeOfStackReserve: 0x{0:X}" -f $stackReserve)
          if ($stackReserve -ne $expectedStackReserve) {
            Write-Error ("Expected SizeOfStackReserve 0x{0:X}, got 0x{1:X}" -f $expectedStackReserve, $stackReserve)
            exit 1
          }

      # DigiCert KeyLocker keeps the private key in an HSM, which is what a
      # code-signing certificate issued after June 2023 requires: the
      # CA/Browser Forum baseline requirements stopped allowing exportable
      # keys, so there is no PFX to hand a runner.
      #
      # The whole block is skipped when the credentials are absent, so a fork
      # still produces an installer. It is unsigned, and the release job below
      # refuses to publish one.
      - name: Stage the DigiCert client certificate
        id: digicert-cert
        if: ${{ env.SM_API_KEY != '' }}
        shell: bash
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          : "${SM_CLIENT_CERT_FILE_B64:?SM_CLIENT_CERT_FILE_B64 is required for signing}"
          cert_path="$RUNNER_TEMP/digicert-client.p12"
          echo "$SM_CLIENT_CERT_FILE_B64" | base64 --decode > "$cert_path"
          # Windows-style path: the DigiCert tools are native Windows binaries.
          echo "SM_CLIENT_CERT_FILE=$(cygpath -w "$cert_path")" >> "$GITHUB_ENV"
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SM_CODE_SIGNING_CERT_SHA1_HASH=${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}" >> "$GITHUB_ENV"
          echo "SM_KEYPAIR_ALIAS=${{ secrets.SM_KEYPAIR_ALIAS }}" >> "$GITHUB_ENV"

      - name: Install the DigiCert signing tools
        if: ${{ env.SM_API_KEY != '' }}
        uses: digicert/ssm-code-signing@1d820463733701cf1484c7eb5d7d24a15ca2c454 # v1.2.1

      # Registers the signing certificate with the Windows certificate store
      # and the DigiCert KSP, which is how signtool reaches a key it cannot
      # hold.
      - name: Register the signing certificate
        if: ${{ env.SM_API_KEY != '' }}
        shell: cmd
        run: |
          smctl healthcheck --all
          smksp_registrar.exe list
          smctl windows certsync --keypair-alias=%SM_KEYPAIR_ALIAS%

      - name: Sign the agent binary
        if: ${{ env.SM_API_KEY != '' }}
        shell: pwsh
        run: ./scripts/windows/sign.ps1 -Path target/release/rustinel.exe -Required

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      # The binary is already signed, so the MSI wraps a signed executable and
      # is itself signed here. Signing only the MSI would leave an unsigned
      # agent on disk after installation, which is the file Windows judges on
      # every launch.
      - name: Build the installer
        shell: pwsh
        env:
          SIGNING_AVAILABLE: ${{ env.SM_API_KEY != '' }}
        run: |
          if ($env:SIGNING_AVAILABLE -eq 'true') {
            ./scripts/windows/build-msi.ps1 `
              -Version "${{ steps.version.outputs.version }}" `
              -Sign -RequireSigning
          }
          else {
            Write-Warning 'No signing credentials; building an unsigned installer.'
            ./scripts/windows/build-msi.ps1 -Version "${{ steps.version.outputs.version }}"
          }

      - name: Verify the installer
        shell: pwsh
        env:
          SIGNING_AVAILABLE: ${{ env.SM_API_KEY != '' }}
        run: |
          $msi = (Get-Item dist/*.msi).FullName
          if ($env:SIGNING_AVAILABLE -eq 'true') {
            ./scripts/windows/verify-msi.ps1 -Path $msi -ExpectSigned
          }
          else {
            ./scripts/windows/verify-msi.ps1 -Path $msi
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustinel-windows-x86_64
          path: target/release/rustinel.exe
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustinel-windows-installer
          path: dist/*.msi
          retention-days: 1

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    needs: ci
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Import signing identity
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          : "${SIGN_IDENTITY:?MACOS_SIGN_IDENTITY is required}"
          : "${CERT_P12_BASE64:?MACOS_CERT_P12_BASE64 is required}"
          : "${CERT_PASSWORD:?MACOS_CERT_PASSWORD is required}"
          KEYCHAIN="$RUNNER_TEMP/rustinel-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build signed app bundle
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          TARGET: ${{ matrix.target }}
        run: |
          : "${PROVISION_PROFILE_BASE64:?MACOS_PROVISIONING_PROFILE_BASE64 is required}"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/rustinel.provisionprofile"
          scripts/macos/package-app.sh \
            --binary "target/$TARGET/release/rustinel" \
            --output "$RUNNER_TEMP/Rustinel.app" \
            --profile "$RUNNER_TEMP/rustinel.provisionprofile" \
            --identity "$SIGN_IDENTITY" \
            --version "${GITHUB_REF_NAME#v}"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          : "${NOTARY_APPLE_ID:?MACOS_NOTARY_APPLE_ID is required}"
          : "${NOTARY_TEAM_ID:?MACOS_NOTARY_TEAM_ID is required}"
          : "${NOTARY_PASSWORD:?MACOS_NOTARY_PASSWORD is required}"
          ditto -c -k --keepParent "$RUNNER_TEMP/Rustinel.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Rustinel.app"
          xcrun stapler validate "$RUNNER_TEMP/Rustinel.app"
          spctl --assess --type execute --verbose=4 "$RUNNER_TEMP/Rustinel.app"

      - name: Package macOS ${{ matrix.arch }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          PKG="rustinel-${GITHUB_REF_NAME#v}-${TARGET}"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/logs" "$PKG/scripts/install" "$PKG/examples"
          ditto "$RUNNER_TEMP/Rustinel.app" "$PKG/Rustinel.app"
          ln -s "Rustinel.app/Contents/MacOS/rustinel" "$PKG/rustinel"
          cp config.toml README.md packaging/macos/com.rustinel.agent.plist "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          chmod +x "$PKG/scripts/install/install.sh" "$PKG/examples/siem/splunk/send-alerts.py"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          touch "$PKG/logs/.gitkeep"
          tar czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustinel-macos-${{ matrix.arch }}
          path: rustinel-*-${{ matrix.target }}.tar.gz
          retention-days: 1

  atomic-release:
    name: Atomic Release (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
      - build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            artifact: rustinel-linux-x86_64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            artifact: rustinel-linux-arm64
          - label: windows-x86_64
            runner: windows-latest
            platform: windows
            artifact: rustinel-windows-x86_64
          - label: macos-arm64
            runner: macos-latest
            platform: macos
            artifact: rustinel-macos-arm64
          - label: macos-x86_64
            # macos-13 is retired; use the supported Intel runner.
            runner: macos-15-intel
            platform: macos
            artifact: rustinel-macos-x86_64
            experimental: true
    # Intel macOS remains optional because the hosted runner is legacy.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact/

      - name: Check out pinned rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Karib0u/rustinel-rules
          ref: ${{ env.RUSTINEL_RULES_REF }}
          path: rustinel-rules
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build pinned rules pack
        working-directory: rustinel-rules
        run: |
          uv sync --frozen
          uv run python tools/validate.py
          uv run python tools/build_packs.py

      - name: Check atomic coverage metadata
        working-directory: rustinel-rules
        run: python tests/atomic/run_atomics.py --check-coverage --strict-essential

      - name: Prepare Linux artifact
        if: matrix.platform == 'linux'
        run: |
          test -f release-artifact/rustinel
          chmod +x release-artifact/rustinel
          echo "RUSTINEL_ENGINE_BIN=$GITHUB_WORKSPACE/release-artifact/rustinel" >> "$GITHUB_ENV"
        shell: bash

      - name: Prepare Windows artifact
        if: matrix.platform == 'windows'
        run: |
          if (!(Test-Path release-artifact\rustinel.exe)) {
            throw "Release executable not found"
          }
          "RUSTINEL_ENGINE_BIN=$env:GITHUB_WORKSPACE\release-artifact\rustinel.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Prepare signed macOS artifact
        if: matrix.platform == 'macos'
        run: |
          package="$(find release-artifact -type f -name '*.tar.gz' -print -quit)"
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/rustinel-package"
          tar -xzf "$package" -C "$RUNNER_TEMP/rustinel-package"
          app="$(find "$RUNNER_TEMP/rustinel-package" -type d -name Rustinel.app -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          binary="$app/Contents/MacOS/rustinel"
          test -x "$binary"
          echo "RUSTINEL_ENGINE_BIN=$binary" >> "$GITHUB_ENV"
        shell: bash

      - name: Exclude workspace from Defender (Windows, for EICAR)
        if: matrix.platform == 'windows'
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Run atomic tests (Linux)
        if: matrix.platform == 'linux'
        working-directory: rustinel-rules
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform linux \
            --engine-bin "$RUSTINEL_ENGINE_BIN" \
            --engine-dir "$GITHUB_WORKSPACE/rustinel-rules/tests/atomic/.engine" \
            --rules-dir "$GITHUB_WORKSPACE/rustinel-rules" \
            --pack auto
        shell: bash

      - name: Run atomic tests (Windows)
        if: matrix.platform == 'windows'
        working-directory: rustinel-rules
        run: |
          python tests\atomic\run_atomics.py `
            --platform windows `
            --engine-bin "$env:RUSTINEL_ENGINE_BIN" `
            --engine-dir "$env:GITHUB_WORKSPACE\rustinel-rules\tests\atomic\.engine" `
            --rules-dir "$env:GITHUB_WORKSPACE\rustinel-rules" `
            --pack auto
        shell: pwsh

      - name: Run atomic tests (macOS)
        if: matrix.platform == 'macos'
        working-directory: rustinel-rules
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform macos \
            --engine-bin "$RUSTINEL_ENGINE_BIN" \
            --engine-dir "$GITHUB_WORKSPACE/rustinel-rules/tests/atomic/.engine" \
            --rules-dir "$GITHUB_WORKSPACE/rustinel-rules" \
            --pack auto
        shell: bash

      - name: Prepare atomic logs for upload (Unix)
        if: always() && matrix.platform != 'windows'
        run: |
          if [ -d rustinel-rules/tests/atomic/.engine/logs ]; then
            sudo chown -R "$(id -u):$(id -g)" rustinel-rules/tests/atomic/.engine/logs
          fi
        shell: bash

      - name: Upload atomic report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atomic-release-${{ matrix.label }}
          path: |
            rustinel-rules/tests/atomic/report-*.json
            rustinel-rules/tests/atomic/.engine/engine.stdout.log
            rustinel-rules/tests/atomic/.engine/logs/
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
      - build-macos
      - atomic-release
    permissions:
      contents: write # create the GitHub Release and upload release assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-linux-x86_64
          path: dist/linux-x86_64/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-linux-arm64
          path: dist/linux-arm64/

      - name: Download Windows x86_64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-windows-x86_64
          path: dist/windows-x86_64/

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-windows-installer
          path: dist/windows-installer/

      - name: Download macOS arm64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-macos-arm64
          path: dist/macos-arm64/

      - name: Download macOS x86_64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-macos-x86_64
          path: dist/macos-x86_64/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package Linux x86_64
        run: |
          PKG="rustinel-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/logs" "$PKG/scripts/install" "$PKG/examples"
          cp dist/linux-x86_64/rustinel "$PKG/"
          chmod +x "$PKG/rustinel"
          cp config.toml README.md rustinel.service "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          chmod +x "$PKG/scripts/install/install.sh" "$PKG/examples/siem/splunk/send-alerts.py"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          touch "$PKG/logs/.gitkeep"
          tar czf "$PKG.tar.gz" "$PKG"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Linux arm64
        run: |
          PKG="rustinel-${VERSION}-aarch64-unknown-linux-musl"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/logs" "$PKG/scripts/install" "$PKG/examples"
          cp dist/linux-arm64/rustinel "$PKG/"
          chmod +x "$PKG/rustinel"
          cp config.toml README.md rustinel.service "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          chmod +x "$PKG/scripts/install/install.sh" "$PKG/examples/siem/splunk/send-alerts.py"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          touch "$PKG/logs/.gitkeep"
          tar czf "$PKG.tar.gz" "$PKG"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Windows x86_64
        run: |
          PKG="rustinel-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/logs" "$PKG/scripts/install" "$PKG/examples"
          cp dist/windows-x86_64/rustinel.exe "$PKG/"
          cp config.toml README.md "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          touch "$PKG/logs/.gitkeep"
          zip -r "$PKG.zip" "$PKG"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Stage Windows installer
        run: cp dist/windows-installer/*.msi .

      # The build job is allowed to produce unsigned Windows artifacts, because
      # a fork has no access to the signing secrets and should still be able to
      # cut a release of its own. This repository is not allowed to publish one.
      #
      # The gate is deliberately not conditioned on the secret being present.
      # Every signing step in the build job is skipped when SM_API_KEY is
      # absent, so a secret that was deleted, rotated, or left to expire turns
      # a signed release into an unsigned one with no failure anywhere. That is
      # the case this catches: an MSI asks a user to hand it SYSTEM, and an
      # unsigned one teaches them to click past the warning that says not to.
      #
      # Both Windows artifacts are checked. The portable zip carries the same
      # agent binary as the MSI, and shipping a signed installer beside an
      # unsigned executable would undo the point of signing either.
      - name: Refuse to publish unsigned Windows artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_REQUIRED: ${{ github.repository == 'Karib0u/rustinel' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osslsigncode

          ca=/etc/ssl/certs/ca-certificates.crt
          status=0

          # osslsigncode reads both Authenticode containers: the certificate
          # table of a PE, and the digital signature stream of an MSI.
          for artifact in "rustinel-${VERSION}-x86_64.msi" dist/windows-x86_64/rustinel.exe; do
            test -f "$artifact"
            echo "--- $artifact"
            report="$(osslsigncode verify -CAfile "$ca" -TSA-CAfile "$ca" -in "$artifact" 2>&1 || true)"
            echo "$report"

            # Matched positively. If a future osslsigncode renames its verdict,
            # this falls through to the error below and fails the release
            # rather than waving an unverified artifact through.
            if grep -qi 'Signature verification: ok' <<<"$report"; then
              echo "$artifact carries a verified Authenticode signature."
              continue
            fi

            if grep -qi 'No signature found' <<<"$report"; then
              if [ "$SIGNING_REQUIRED" = true ]; then
                echo "::error::$artifact is unsigned. The signing credentials are"
                echo "::error::missing or expired; see docs/windows-installer.md."
                status=1
              else
                echo "::warning::$artifact is unsigned. Forks have no signing credentials."
              fi
              continue
            fi

            # Signed, but the signature did not verify. Either the artifact was
            # altered after signing, or the chain could not be built from the
            # runner trust store. Neither is something to publish through.
            echo "::error::$artifact is signed but its signature did not verify."
            status=1
          done

          exit "$status"

      - name: Stage macOS packages
        run: |
          cp dist/macos-arm64/*.tar.gz .
          cp dist/macos-x86_64/*.tar.gz .

      - name: Generate SHA256 checksums
        run: |
          sha256sum \
            rustinel-${VERSION}-x86_64-unknown-linux-musl.tar.gz \
            rustinel-${VERSION}-aarch64-unknown-linux-musl.tar.gz \
            rustinel-${VERSION}-x86_64-pc-windows-msvc.zip \
            rustinel-${VERSION}-x86_64.msi \
            rustinel-${VERSION}-aarch64-apple-darwin.tar.gz \
            rustinel-${VERSION}-x86_64-apple-darwin.tar.gz \
            > rustinel-${VERSION}-checksums-sha256.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rustinel-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            rustinel-${{ steps.version.outputs.version }}-x86_64.msi
            rustinel-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            rustinel-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            rustinel-${{ steps.version.outputs.version }}-x86_64.msi
            rustinel-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          name: Rustinel ${{ github.ref_name }}
          body: |
            ## Downloads

            | Platform | Architecture | Package |
            |---|---|---|
            | Linux | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz` |
            | Linux | arm64 | `rustinel-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz` |
            | Windows | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64.msi` (signed installer) |
            | Windows | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip` (portable) |
            | macOS | arm64 | `rustinel-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz` |
            | macOS | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz` |

            ## Installer

            **Linux**

            ```sh
            curl -fsSL https://rustinel.io/install.sh | sh -s -- --version ${{ steps.version.outputs.version }} --run
            ```

            **macOS**

            ```sh
            curl -fsSL https://rustinel.io/install.sh | sh -s -- --version ${{ steps.version.outputs.version }}
            cd rustinel
            ```

            macOS support is experimental. Endpoint Security requires root and a one-time Full Disk Access approval before the first successful start. See the install guide for the interactive terminal and LaunchDaemon approval paths, then run:

            ```sh
            sudo ./rustinel run
            ```

            **Windows (PowerShell)**

            Permanent install, from an elevated prompt. Installs the signed MSI
            and registers the service:

            ```powershell
            $env:RUSTINEL_VERSION='${{ steps.version.outputs.version }}'; $env:RUSTINEL_MSI='1'; irm https://rustinel.io/install.ps1 | iex; Remove-Item Env:\RUSTINEL_VERSION, Env:\RUSTINEL_MSI -ErrorAction SilentlyContinue
            ```

            Portable evaluation, which unpacks into the current directory and
            installs nothing:

            ```powershell
            $env:RUSTINEL_VERSION='${{ steps.version.outputs.version }}'; irm https://rustinel.io/install.ps1 | iex; Remove-Item Env:\RUSTINEL_VERSION -ErrorAction SilentlyContinue
            ```

            Full install, configuration, and SIEM ingestion guides: https://docs.rustinel.io/getting-started/

            Scripts install published release binaries only. Verify downloads with `rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt`.

            ## Provenance

            All release artifacts have [SLSA build provenance](https://slsa.dev) attestations signed by GitHub:

            ```sh
            gh attestation verify <artifact> \
              --repo Karib0u/rustinel \
              --signer-workflow Karib0u/rustinel/.github/workflows/release.yml
            ```
